<div class="container">
  <ng-container *ngIf="flag === 1">
    <h3 mat-dialog-title>Adding turisticka agencija</h3>
  </ng-container>
  <ng-container *ngIf="flag === 2">
    <h3 mat-dialog-title>Updating turisticka agencija: {{ data.naziv }}</h3>
  </ng-container>
  <ng-container *ngIf="flag === 3">
    <h3 mat-dialog-title>Deleting turisticka agencija: {{ data.naziv }}</h3>
  </ng-container>

  <form class="mat-dialog-content" #formControl="ngForm">
    <div class="form">
      <mat-form-field>
        <input
          matInput
          placeholder="Naziv"
          name="Naziv"
          [disabled]="flag == 3"
          [(ngModel)]="data.naziv"
          required
        />
      </mat-form-field>
    </div>

    <div class="form">
      <mat-form-field>
        <input
          matInput
          placeholder="Adresa"
          name="Adresa"
          [disabled]="flag == 3"
          [(ngModel)]="data.adresa"
          required
        />
      </mat-form-field>
    </div>

     <div class="form">
      <mat-form-field>
        <input
          matInput
          placeholder="Kontakt"
          name="Kontakt"
          [disabled]="flag == 3"
          [(ngModel)]="data.kontakt"
          required
        />
      </mat-form-field>
    </div>
  </form>

  <div class="mat-dialog-actions">
    <ng-container *ngIf="flag === 1">
      <button
        matButton
        type="submit"
        (click)="add()"
        [disabled]="!formControl.valid"
      >
        Save
      </button>
    </ng-container>
    <ng-container *ngIf="flag === 2">
      <button
        matButton
        type="submit"
        (click)="update()"
        [disabled]="!formControl.valid"
      >
        Update
      </button>
    </ng-container>
    <ng-container *ngIf="flag === 3">
      <button matButton (click)="delete()">
        Delete
      </button>
    </ng-container>

    <button matButton (click)="cancel()">Cancel</button>
  </div>
</div>
