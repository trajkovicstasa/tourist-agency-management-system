<mat-toolbar color="primary">
  <span class="title-center">Turisticka agencija</span>
</mat-toolbar>

<div class="container mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort class="mat-cell">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <ng-container matColumnDef="naziv">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Naziv</th>
      <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
    </ng-container>

    <ng-container matColumnDef="adresa">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Adresa</th>
      <td mat-cell *matCellDef="let row">{{ row.adresa }}</td>
    </ng-container>

    <ng-container matColumnDef="kontakt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Kontakt</th>
      <td mat-cell *matCellDef="let row">{{ row.kontakt }}</td>
    </ng-container>

   <ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef>
    <button mat-icon-button (click)="$event.stopPropagation(); openDialog(1)">
      <mat-icon color="accent">add</mat-icon>
    </button>
  </th>

  <td mat-cell *matCellDef="let row">

    <button
      mat-icon-button
      (click)="$event.stopPropagation(); openDialog(2, row.id, row.naziv, row.adresa, row.kontakt)"
    >
      <mat-icon color="primary">edit</mat-icon>
    </button>

    <button
      mat-icon-button
      (click)="$event.stopPropagation(); openDialog(3, row.id, row.naziv, row.adresa, row.kontakt)"
    >
      <mat-icon color="warn">delete</mat-icon>
    </button>

  </td>
</ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selectRow(row)"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<div class="selected-info" *ngIf="parentSelectedTuristickaAgencija as selectedAgencija">
  <p>Izabrana turisticka agencija: {{ selectedAgencija.naziv }}</p>
  <button mat-button type="button" (click)="setActiveChild('aranzman')">Aranzmani</button>
  <button mat-button type="button" (click)="setActiveChild('hotel')">Hoteli</button>
</div>

<app-hotel-component
  *ngIf="activeChild === 'hotel'"
></app-hotel-component>

<app-aranzman-component
  *ngIf="activeChild === 'aranzman'"
  [childSelectedTuristickaAgencija]="parentSelectedTuristickaAgencija"
></app-aranzman-component>
