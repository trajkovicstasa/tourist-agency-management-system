<mat-toolbar color="primary">
  <span class="title-center">Destinacija</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table [dataSource]="dataSource" class="mat-cell">
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Mesto -->
    <ng-container matColumnDef="mesto">
      <th mat-header-cell *matHeaderCellDef>Mesto</th>
      <td mat-cell *matCellDef="let row">{{ row.mesto }}</td>
    </ng-container>

    <!-- Drzava -->
    <ng-container matColumnDef="drzava">
      <th mat-header-cell *matHeaderCellDef>Drzava</th>
      <td mat-cell *matCellDef="let row">{{ row.drzava }}</td>
    </ng-container>

    <!-- Opis -->
    <ng-container matColumnDef="opis">
      <th mat-header-cell *matHeaderCellDef>Opis</th>
      <td mat-cell *matCellDef="let row">{{ row.opis }}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="openDialog(2, row.id, row.mesto, row.drzava, row.opis)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.mesto, row.drzava, row.opis)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
