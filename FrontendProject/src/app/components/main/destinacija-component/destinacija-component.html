<mat-toolbar color="primary">
  <span class="title-center">Destinacija</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table [dataSource]="dataSource" matSort class="mat-cell">
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Mesto -->
    <ng-container matColumnDef="mesto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Mesto</th>
      <td mat-cell *matCellDef="let row">{{ row.mesto }}</td>
    </ng-container>

    <!-- Drzava -->
    <ng-container matColumnDef="drzava">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Drzava</th>
      <td mat-cell *matCellDef="let row">{{ row.drzava }}</td>
    </ng-container>

    <!-- Opis -->
    <ng-container matColumnDef="opis">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Opis</th>
      <td mat-cell *matCellDef="let row">{{ row.opis }}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="$event.stopPropagation(); openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="$event.stopPropagation(); openDialog(2, row.id, row.mesto, row.drzava, row.opis)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="$event.stopPropagation(); openDialog(3, row.id, row.mesto, row.drzava, row.opis)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selectRow(row)"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<div class="selected-info" *ngIf="selectedDestinacija as destinacija">
  <p>Izabrana destinacija: {{ destinacija.mesto }}, {{ destinacija.drzava }}</p>
  <p>Prikazani su hoteli za izabranu destinaciju.</p>
</div>

<app-hotel-component
  *ngIf="selectedDestinacija"
  [childSelectedDestinacija]="selectedDestinacija"
></app-hotel-component>
