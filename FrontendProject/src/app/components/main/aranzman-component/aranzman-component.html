<mat-toolbar color="primary">
  <span class="title-center">Aranzman</span>
</mat-toolbar>

<div class="container mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort class="mat-cell">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <ng-container matColumnDef="ukupnaCena">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ukupna cena</th>
      <td mat-cell *matCellDef="let row">{{ row.ukupnaCena }}</td>
    </ng-container>

    <ng-container matColumnDef="placeno">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Placeno</th>
      <td mat-cell *matCellDef="let row">{{ row.placeno }}</td>
    </ng-container>

    <ng-container matColumnDef="datumRealizacije">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Datum realizacije</th>
      <td mat-cell *matCellDef="let row">{{ row.datumRealizacije | date:'dd.MM.yyyy.' }}</td>
    </ng-container>

    <ng-container matColumnDef="hotel">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Hotel</th>
      <td mat-cell *matCellDef="let row">{{ row.hotel?.naziv }}</td>
    </ng-container>

    <ng-container matColumnDef="agencija">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Agencija</th>
      <td mat-cell *matCellDef="let row">{{ row.agencija?.naziv }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>

      <td mat-cell *matCellDef="let row">
        <button
          mat-icon-button
          (click)="openDialog(2, row.id, row.ukupnaCena, row.placeno, row.datumRealizacije, row.hotel, row.agencija)"
        >
          <mat-icon color="primary">edit</mat-icon>
        </button>

        <button
          mat-icon-button
          (click)="openDialog(3, row.id, row.ukupnaCena, row.placeno, row.datumRealizacije, row.hotel, row.agencija)"
        >
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
